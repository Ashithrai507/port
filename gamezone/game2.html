<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Game — Puzzle Tap</title>
  <style>
    html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto;background:#05050a;color:#fff}
    .wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
    .board{width:320px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
    .tile{height:72px;background:#0b0b12;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;cursor:pointer}
    .btn{padding:8px 12px;border-radius:8px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;text-decoration:none}
  </style>
</head>
<body>
  <div class="wrap">
    <h2>Puzzle Tap — Demo</h2>
    <div class="hud"><div>Score: <span id="score">0</span></div><button class="btn" id="shuffle">Shuffle</button><a class="btn" href="index.html">← Back</a></div>
    <div class="board" id="board"></div>
    <p style="color:#bdbdc2">Tap the highlighted tile to score. This is a small interactive placeholder for a puzzle-like game.</p>
  </div>

  <script>
    const board = document.getElementById('board');
    const scoreEl = document.getElementById('score');
    const shuffleBtn = document.getElementById('shuffle');
    let activeIndex = null; let score = 0;

    function build(){
      board.innerHTML='';
      for(let i=0;i<16;i++){
        const t = document.createElement('div');
        t.className='tile';
        t.textContent = i+1;
        t.dataset.index = i;
        t.addEventListener('click', ()=>{
          if(parseInt(t.dataset.index)===activeIndex){ score++; scoreEl.textContent = score; activateRandom(); }
        });
        board.appendChild(t);
      }
      activateRandom();
    }

    function activateRandom(){
      const tiles = board.querySelectorAll('.tile');
      tiles.forEach(t=>t.style.background='#0b0b12');
      activeIndex = Math.floor(Math.random()*16);
      tiles[activeIndex].style.background = 'linear-gradient(135deg,#ffb86b,#ff6b9a)';
    }

    shuffleBtn.addEventListener('click', ()=>{ score=0; scoreEl.textContent=score; activateRandom(); });
    build();
  </script>
</body>
</html>
